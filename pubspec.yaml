name: gg_args
description: Additions and helpers to the args packages needed by various of our projects.
version: 3.0.1
repository: https://github.com/inlavigo/gg_args.git

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  args: ^2.7.0
  gg_capture_print: ^1.0.10
  gg_console_colors: ^2.3.1
  gg_log: ^1.0.7
  gg_process: ^1.1.7
  matcher: ^0.12.20
  meta: ^1.19.0
  mocktail: ^1.0.5
  path: ^1.9.1
  recase: ^4.1.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2